[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "d5-security-layer"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",         # PostgreSQL driver
    "aiosqlite>=0.20.0",       # SQLite driver for dev
    "alembic>=1.14.0",
    "pyjwt>=2.10.0",
    "cryptography>=44.0.0",    # For RS256 key generation
    "httpx>=0.28.0",
    "langsmith>=0.3.0",
    "structlog>=25.1.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.18",
    # PII / PHI detection
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.4.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

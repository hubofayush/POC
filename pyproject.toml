[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "d5-security-layer"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",         # PostgreSQL driver
    "aiosqlite>=0.20.0",       # SQLite driver for dev
    "alembic>=1.14.0",
    "pyjwt>=2.10.0",
    "cryptography>=44.0.0",    # For RS256 key generation
    "pwdlib[argon2]>=0.2.1",   # Password hashing (argon2id)
    "httpx>=0.28.0",
    "langsmith>=0.3.0",
    "structlog>=25.1.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.18",
    "prometheus-client>=0.26.0",
    # PII / PHI detection
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.4.0,<4.0.0",
    # Semantic guardrails (embedding similarity — ingress layers 2.5 / 4)
    "sentence-transformers>=5.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.16.0",
    "mypy>=1.18.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "FURB", "PLR0402"]
ignore = [
    "B008",     # FastAPI dependency-injection defaults (Depends(...)) are intentional
    "BLE001",   # broad except is deliberate at pipeline/egress/PHI boundaries
    "B017",     # assertRaises without match is fine in these tests
    "TRY004",   # no try/except-pattern policy
    "ASYNC221", # no subprocess usage in app code
    "RUF001",   # ambiguous unicode arrows in docstrings are intentional
    "RUF002",
    "RUF003",
    "RUF012",   # mutable class attrs (SQLAlchemy patterns)
    "RUF022",   # __all__ ordering is not a project concern
    "SIM102",   # collapsible-if readability preference
]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]     # router imports intentionally after app construction
"tests/conftest.py" = ["E402"]  # env must be set before app imports

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
exclude = ["scripts/"]

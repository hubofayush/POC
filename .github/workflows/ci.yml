name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs for the same branch on new pushes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Code quality + unit tests
  # Fast feedback — runs in ~2 min, no Docker needed.
  # Triggered on every push and PR.
  # ────────────────────────────────────────────────────────────────────────────
  quality:
    name: "Quality (lint + types + unit tests)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e ".[dev]"

      # - name: Ruff lint
      # run: ruff check app/ tests/ scripts/

      # - name: Mypy type check
      #   run: mypy app/ tests/

      - name: Pytest (unit tests — fast, in-process, no Docker)
        run: pytest -q --no-header --ignore=tests/smoke --ignore=tests/load

      - name: Verify alembic migrations upgrade cleanly
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_mig.db
        run: |
          alembic upgrade head
          alembic current
  build-and-push-docker:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKER_USERNAME }}/d5-security
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
